<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
    <title>Evaluaciones Psicométricas</title>

    <style>
        /* Pantalla de carga: visible antes de que cargue la aplicación */
        html,
        body {
            margin: 0;
            background: #f4f7fb;
        }

        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(900px 420px at 50% 0%, rgba(26, 115, 201, 0.08), transparent 70%),
                #f4f7fb;
            font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }

        #splash.splash-hidden {
            opacity: 0;
            visibility: hidden;
        }

        .splash-box {
            width: min(340px, 100%);
            animation: splashRise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .splash-tests {
            display: block;
            color: #1a73c9;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.4px;
        }

        .splash-title {
            display: block;
            margin-top: 8px;
            color: #0d1b2a;
            font-family: "Sora", "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
            line-height: 1.25;
        }

        .splash-progress {
            margin-top: 28px;
        }

        .splash-progress-info {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .splash-status {
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
        }

        .splash-percent {
            color: #0d1b2a;
            font-family: "Sora", "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
            font-size: 13px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .splash-track {
            position: relative;
            height: 6px;
            overflow: hidden;
            background: #e3e9f1;
            border-radius: 99px;
        }

        .splash-fill {
            position: relative;
            width: 0%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(90deg, #0f5aa3 0%, #1a73c9 55%, #3b9bea 100%);
            border-radius: 99px;
        }

        /* Brillo que recorre la barra */
        .splash-fill::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
            transform: translateX(-100%);
            animation: splashShine 1.1s ease-in-out infinite;
        }

        .splash-steps {
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
        }

        .splash-step {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        .splash-step::before {
            content: "";
            width: 6px;
            height: 6px;
            border: 1.5px solid currentColor;
            border-radius: 50%;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .splash-step.done {
            color: #1a73c9;
        }

        .splash-step.done::before {
            background: #1a73c9;
        }

        @keyframes splashRise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes splashShine {
            to { transform: translateX(100%); }
        }
    </style>
</head>

<body>
    <div id="splash" role="status" aria-label="Cargando aplicación">
        <div class="splash-box">
            <span class="splash-tests">VALANTI · DISC · 16PF</span>
            <span class="splash-title">Evaluaciones Psicométricas</span>

            <div class="splash-progress">
                <div class="splash-progress-info">
                    <span class="splash-status" id="splash-status">Iniciando</span>
                    <span class="splash-percent" id="splash-percent">0%</span>
                </div>

                <div class="splash-track">
                    <div class="splash-fill" id="splash-fill"></div>
                </div>

                <div class="splash-steps">
                    <span class="splash-step" id="splash-step-1">Pruebas</span>
                    <span class="splash-step" id="splash-step-2">Cuestionario</span>
                    <span class="splash-step" id="splash-step-3">Listo</span>
                </div>
            </div>
        </div>
    </div>

    <div id="root"></div>

    <script>
        // Barra de carga de 2 segundos; se oculta cuando termina y la app ya montó
        (function () {
            var DURACION = 2000;
            var inicio = performance.now();
            var appLista = false;

            var fill = document.getElementById("splash-fill");
            var percent = document.getElementById("splash-percent");
            var status = document.getElementById("splash-status");
            var pasos = [
                { desde: 0, texto: "Cargando pruebas", id: "splash-step-1" },
                { desde: 40, texto: "Preparando cuestionario", id: "splash-step-2" },
                { desde: 85, texto: "Todo listo", id: "splash-step-3" }
            ];

            function suavizar(t) {
                return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            }

            function ocultar() {
                var splash = document.getElementById("splash");
                if (!splash) return;
                splash.classList.add("splash-hidden");
                setTimeout(function () {
                    splash.remove();
                }, 500);
            }

            function cuadro(ahora) {
                var t = Math.min(1, (ahora - inicio) / DURACION);
                var valor = Math.round(suavizar(t) * 100);

                // Si la app aún no carga, la barra espera en 95%
                if (!appLista && valor > 95) valor = 95;

                fill.style.width = valor + "%";
                percent.textContent = valor + "%";

                for (var i = 0; i < pasos.length; i++) {
                    if (valor >= pasos[i].desde) {
                        status.textContent = pasos[i].texto;
                        if (i > 0) document.getElementById(pasos[i - 1].id).classList.add("done");
                    }
                }

                if (valor >= 100) {
                    document.getElementById("splash-step-3").classList.add("done");
                    setTimeout(ocultar, 250);
                    return;
                }

                requestAnimationFrame(cuadro);
            }

            requestAnimationFrame(cuadro);

            window.__ocultarSplash = function () {
                appLista = true;
            };
        })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
