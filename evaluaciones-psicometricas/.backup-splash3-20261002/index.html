<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
    <title>Evaluaciones Psicométricas</title>

    <style>
        /* Pantalla de carga: visible antes de que cargue la aplicación */
        html,
        body {
            margin: 0;
            background: #f4f7fb;
        }

        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 24px;
            background:
                radial-gradient(900px 420px at 50% 0%, rgba(26, 115, 201, 0.08), transparent 70%),
                #f4f7fb;
            font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }

        #splash.splash-hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Ícono animado */
        .splash-mark {
            position: relative;
            width: 120px;
            height: 120px;
            animation: splashRise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .splash-mark svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .splash-track {
            fill: none;
            stroke: #e3e9f1;
            stroke-width: 2;
        }

        /* Arco que gira alrededor del ícono */
        .splash-spinner {
            fill: none;
            stroke: #1a73c9;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-dasharray: 90 287;
            transform-origin: 60px 60px;
            animation: splashSpin 1.1s linear infinite;
        }

        /* Portapapeles */
        .splash-board {
            fill: #ffffff;
            stroke: #1a73c9;
            stroke-width: 2.5;
            stroke-linejoin: round;
        }

        .splash-clip {
            fill: #ffffff;
            stroke: #1a73c9;
            stroke-width: 2.5;
            stroke-linejoin: round;
        }

        .splash-line {
            fill: none;
            stroke: #b9cde3;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-dasharray: 24;
            stroke-dashoffset: 24;
            animation: splashDraw 0.35s ease forwards;
        }

        .splash-line.l1 { animation-delay: 0.35s; }
        .splash-line.l2 { animation-delay: 0.6s; }
        .splash-line.l3 { animation-delay: 0.85s; }

        .splash-dot {
            fill: #1a73c9;
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
            animation: splashPop 0.3s ease forwards;
        }

        .splash-dot.d1 { animation-delay: 0.3s; }
        .splash-dot.d2 { animation-delay: 0.55s; }
        .splash-dot.d3 { animation-delay: 0.8s; }

        /* Check final */
        .splash-check {
            fill: none;
            stroke: #15803d;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            animation: splashDraw 0.4s ease 1.3s forwards;
        }

        .splash-badge {
            fill: #ecfdf3;
            stroke: #bfe8cf;
            stroke-width: 1.5;
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
            animation: splashPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 1.15s forwards;
        }

        /* Textos */
        .splash-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: splashRise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        .splash-title {
            color: #0d1b2a;
            font-family: "Sora", "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .splash-tests {
            color: #1a73c9;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.4px;
        }

        .splash-subtitle {
            margin-top: 4px;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
        }

        .splash-dots::after {
            content: "";
            display: inline-block;
            width: 1.2em;
            text-align: left;
            animation: splashDots 1.2s steps(4, end) infinite;
        }

        @keyframes splashRise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes splashSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes splashDraw {
            to { stroke-dashoffset: 0; }
        }

        @keyframes splashPop {
            from { opacity: 0; transform: scale(0.4); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes splashDots {
            0% { content: ""; }
            25% { content: "."; }
            50% { content: ".."; }
            75% { content: "..."; }
        }

        @media (prefers-reduced-motion: reduce) {
            #splash *,
            #splash *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0s !important;
            }
        }
    </style>
</head>

<body>
    <div id="splash" role="status" aria-label="Cargando aplicación">
        <div class="splash-mark" aria-hidden="true">
            <svg viewBox="0 0 120 120">
                <circle class="splash-track" cx="60" cy="60" r="58" />
                <circle class="splash-spinner" cx="60" cy="60" r="58" />

                <rect class="splash-board" x="38" y="30" width="44" height="58" rx="7" />
                <rect class="splash-clip" x="50" y="25" width="20" height="10" rx="3.5" />

                <circle class="splash-dot d1" cx="47" cy="50" r="2.6" />
                <line class="splash-line l1" x1="54" y1="50" x2="73" y2="50" />
                <circle class="splash-dot d2" cx="47" cy="61" r="2.6" />
                <line class="splash-line l2" x1="54" y1="61" x2="73" y2="61" />
                <circle class="splash-dot d3" cx="47" cy="72" r="2.6" />
                <line class="splash-line l3" x1="54" y1="72" x2="67" y2="72" />

                <circle class="splash-badge" cx="80" cy="84" r="12" />
                <path class="splash-check" d="M74.5 84.5l3.8 3.8 7.2-7.6" />
            </svg>
        </div>

        <div class="splash-text">
            <span class="splash-tests">VALANTI · DISC · 16PF</span>
            <span class="splash-title">Evaluaciones Psicométricas</span>
            <span class="splash-subtitle">Preparando su evaluación<span class="splash-dots"></span></span>
        </div>
    </div>

    <div id="root"></div>

    <script>
        // Mantiene la pantalla de carga al menos 2 segundos y la oculta cuando la app ya montó
        (function () {
            var inicio = Date.now();
            var DURACION_MINIMA = 2000;

            window.__ocultarSplash = function () {
                var restante = Math.max(0, DURACION_MINIMA - (Date.now() - inicio));

                setTimeout(function () {
                    var splash = document.getElementById("splash");
                    if (!splash) return;
                    splash.classList.add("splash-hidden");
                    setTimeout(function () {
                        splash.remove();
                    }, 500);
                }, restante);
            };
        })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
